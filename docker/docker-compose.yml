version: "3.9"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scrapemind
      POSTGRES_PASSWORD: scrapemind
      POSTGRES_DB: scrapemind
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapemind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://scrapemind:scrapemind@db:5432/scrapemind
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery worker — DB/LLM-heavy queues, prefork pool.
  # `celery` MUST stay in the -Q list: it's the default queue, so anything not
  # named in TASK_ROUTES (core.heartbeat, the purge sweeps, future tasks) only
  # runs because this worker consumes it.
  # Profile: `tasks` so it's only spun up when you explicitly ask
  # (`docker compose --profile tasks up`). The web container stays
  # cheap for everyday dev.
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://scrapemind:scrapemind@db:5432/scrapemind
      REDIS_URL: redis://redis:6379/0
    command: >
      celery -A app.tasks worker
      -Q celery,scrape,llm -c 4
      --max-tasks-per-child=200 --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["tasks"]

  # Celery worker — feed/HTTP fetching only. Threads, not prefork: this queue
  # is pure network wait and both requests and psycopg2 release the GIL while
  # blocked, so 16 threads overlap 16 slow feeds in one process. (Not gevent:
  # psycopg2 is a C extension that blocks the hub, and these tasks do write to
  # the DB — it would add monkeypatch-ordering risk for no throughput.)
  worker-io:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://scrapemind:scrapemind@db:5432/scrapemind
      REDIS_URL: redis://redis:6379/0
    command: >
      celery -A app.tasks worker
      -Q io -P threads -c 16
      --max-tasks-per-child=500 --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["tasks"]

  # Celery beat scheduler — kicks periodic tasks into the broker.
  # Run exactly ONE replica: the schedule lives in a local file
  # (beat_schedule_filename), so a second beat would double-fire everything.
  # The per-user locks in scrape/feed tasks limit the damage, but they are a
  # safety net, not a licence to scale this service.
  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://scrapemind:scrapemind@db:5432/scrapemind
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.tasks beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["tasks"]

  # Mailhog — lokal SMTP yakalayicisi. Email'ler gercek hedefe gitmez,
  # http://localhost:8025 web arayuzunden okunur. Sadece dev icin.
  # Baslatmak: `docker compose --profile mail up -d mailhog`
  # Uygulamayi yonelt: .env -> MAIL_SERVER=localhost, MAIL_PORT=1025
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    profiles: ["mail"]

volumes:
  pg_data:
