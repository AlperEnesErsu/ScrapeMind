name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ui-audit:
    # Separate from lint-and-test: this one downloads a browser, and the unit
    # tests should not wait behind that. Accessibility and reflow regressions
    # are invisible to pytest -- every page in this app scrolled sideways at
    # 320px for months, and six carried controls a screen reader announced
    # with no name.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: scrapemind
          POSTGRES_PASSWORD: scrapemind
          POSTGRES_DB: scrapemind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FLASK_APP: wsgi.py
      FLASK_ENV: testing
      SECRET_KEY: ci-secret
      DATABASE_URL: postgresql://scrapemind:scrapemind@localhost:5432/scrapemind_test
      TEST_DATABASE_URL: postgresql://scrapemind:scrapemind@localhost:5432/scrapemind_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Build the schema
        run: flask db upgrade

      - name: Render signed-in pages
        # Renders through Flask's test client rather than driving a login, so
        # the audit does not depend on the login form working.
        run: python scripts/render_pages.py ui-audit-pages

      - name: Audit — WCAG 2.2 A/AA and reflow
        run: node scripts/audit_ui.mjs ui-audit-pages

  lint-and-test:
    runs-on: ubuntu-latest
    # Hard cap. The last two runs hung in fixture teardown for hours before
    # GitHub's 6h default kicked in. 15 min is plenty for a green run (was
    # ~1.5 min before the recent test/Celery additions).
    timeout-minutes: 15

    services:
      postgres:
        # pgvector, not plain postgres: Faz 5.4 made Paper.embedding a
        # VECTOR(1536) and the first migration runs CREATE EXTENSION vector,
        # which postgres:17-alpine cannot satisfy. Same image as local dev.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: scrapemind
          POSTGRES_PASSWORD: scrapemind
          POSTGRES_DB: scrapemind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FLASK_APP: wsgi.py
      FLASK_ENV: testing
      SECRET_KEY: ci-secret
      TEST_DATABASE_URL: postgresql://scrapemind:scrapemind@localhost:5432/scrapemind_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint — ruff
        run: ruff check app/ tests/ scripts/

      - name: Lint — black
        # tests/ and scripts/ are linted too. The gates live in tests/, and
        # scripts/ is no longer developer-only -- CI itself runs three of them
        # (render_pages, audit_ui, mypy_ratchet), so leaving it unlinted meant
        # the pipeline depended on code nothing checked.
        run: black --check app/ tests/ scripts/

      - name: Type check — mypy (ratchet)
        # Was advisory with continue-on-error, which meant 95 errors reported
        # into a log nobody opens and blocking nothing. A hard gate is not
        # reachable from here, so the count may fall but not rise.
        # See scripts/mypy_ratchet.py and mypy-baseline.txt.
        run: python scripts/mypy_ratchet.py

      - name: Migration check (empty DB → upgrade)
        run: flask db upgrade

      - name: Tests
        # --timeout=60 forces hangs to fail loudly (pytest-timeout).
        # --timeout-method=thread also catches hangs inside blocking syscalls
        # and fixture teardown — the signal-based default missed both in the
        # last run and let it idle until GitHub's 6h cap.
        # -v --tb=short -s makes Actions output readable and live (no capture).
        # The floor was 55%, described in a Faz 2 comment as a temporary drop
        # to be pushed back to 70% once HTTP-level fixtures existed. They do,
        # and coverage measured 82% — so the gate sat 27 points below reality
        # and would have waved through the removal of a quarter of the suite.
        # 80% keeps a small margin for normal movement while still failing on
        # a real regression. Raise it when the number rises; a floor that
        # trails far behind the measurement is not a floor.
        run: pytest -v -s --tb=short --timeout=60 --timeout-method=thread --cov=app --cov-fail-under=80

      - name: Translation consistency (TR == EN key sets)
        run: |
          python - <<'EOF'
          import re, sys
          def keys(path):
              return set(re.findall(r'^msgid "(.+)"', open(path).read(), re.M))
          tr = keys("translations/tr/LC_MESSAGES/messages.po")
          en = keys("translations/en/LC_MESSAGES/messages.po")
          diff = tr.symmetric_difference(en)
          if diff:
              print("Translation mismatch:", diff); sys.exit(1)
          print("Translations OK")
          EOF

      # The step above compares the catalogs to each other, which is blind to a
      # string that never reached either one -- both stay equal and CI stays
      # green while a Turkish reader sees English. Sixty-six strings were in
      # that state. This one compares them to the source.
      - name: Translation coverage (source == catalogs)
        run: python scripts/i18n_audit.py
